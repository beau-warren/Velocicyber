[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "velocicyber"
version = "0.1.0"
description = "Velocicyber: a modular Raspberry Pi terminal coding harness"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "chat-templates/LICENSE.ik_llama.cpp"]
requires-python = ">=3.11"
dependencies = ["textual>=6.12,<7", "httpx>=0.28,<1", "huggingface-hub>=1.32,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
velocicyber = "velocicyber.cli:main"

[tool.setuptools.packages.find]
include = ["velocicyber*"]

[tool.setuptools.package-data]
"velocicyber.ui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-temp"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
